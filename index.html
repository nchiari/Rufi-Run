<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ee">
<title>Rufi Run</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#8fd3ee;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #btns{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;z-index:2}
  #btns button{font:18px 'Lilita One',sans-serif;width:42px;height:42px;background:#fff;color:#3a2416;border:3px solid #3a2416;border-radius:14px;box-shadow:0 3px 0 #3a2416;cursor:pointer;padding:0}
  #btns button:active{transform:translateY(3px);box-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="btns"><button id="mute" aria-label="Sonido">🔊</button><button id="fs" aria-label="Pantalla completa">⛶</button></div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = "'Lilita One', 'Arial Black', sans-serif";
const OUT = '#3a2416';
let W = 320, H = 180, GROUND = 146, SCALE = 1, DPR = 1;

// ---------- colores ----------
const C = {
  white:'#fbf7ef', whiteShade:'#e3d9c8', brown:'#c97b3a', brownDark:'#9a5626', tan:'#e8b67c',
  muzzle:'#e6e0d6', muzzleShade:'#c7beb1', pink:'#ef9a94', tongue:'#f0708c', black:'#1c1716',
  rim:'#efe8dc', collar:'#7f8794', freckle:'#cf9a6a'
};

// ---------- helpers de dibujo ----------
function shape(path, fill, lw=2.4, stroke=OUT){
  ctx.beginPath(); path(); if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(lw){ ctx.lineWidth=lw; ctx.strokeStyle=stroke; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke(); }
}
const ell=(x,y,rx,ry,rot=0)=>()=>ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
const rrect=(x,y,w,h,r)=>()=>ctx.roundRect(x,y,w,h,r);
const hash=i=>{ const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); };

// ---------- Rufi ----------
// Cabeza centrada en (0,0). Mira un poco hacia la derecha (3/4) para correr hacia allá.
function drawHead(t, look){
  const {blink, dead, tongue} = look;
  // oreja lejana (izq): ala hacia afuera con la punta doblada
  shape(()=>{ ctx.moveTo(-9,-11); ctx.quadraticCurveTo(-20,-24,-31,-19); ctx.quadraticCurveTo(-27,-9,-14,-3); ctx.closePath(); }, C.brown);
  shape(()=>{ ctx.moveTo(-12,-10); ctx.quadraticCurveTo(-20,-19,-27,-17); ctx.quadraticCurveTo(-24,-11,-15,-6); ctx.closePath(); }, C.pink, 0);
  shape(()=>{ ctx.moveTo(-26,-20); ctx.quadraticCurveTo(-34,-19,-34,-11); ctx.quadraticCurveTo(-30,-14,-25,-13); ctx.closePath(); }, C.brownDark);
  // oreja cercana (der)
  const flap = Math.sin(t*20)*1.2;
  shape(()=>{ ctx.moveTo(7,-13); ctx.quadraticCurveTo(19,-27,31,-22+flap); ctx.quadraticCurveTo(28,-11,13,-5); ctx.closePath(); }, C.brown);
  shape(()=>{ ctx.moveTo(10,-11); ctx.quadraticCurveTo(19,-22,27,-20+flap); ctx.quadraticCurveTo(24,-13,14,-8); ctx.closePath(); }, C.pink, 0);
  shape(()=>{ ctx.moveTo(26,-23+flap); ctx.quadraticCurveTo(35,-23+flap,36,-14+flap); ctx.quadraticCurveTo(31,-17+flap,25,-16+flap); ctx.closePath(); }, C.brownDark);
  // cráneo
  shape(ell(1,-1,17,16), C.brown);
  // franja clara en la frente
  ctx.fillStyle=C.tan; ctx.beginPath(); ctx.moveTo(1,-16); ctx.quadraticCurveTo(6,-16,6,-10); ctx.lineTo(8,2); ctx.lineTo(-1,2); ctx.lineTo(-1,-10); ctx.quadraticCurveTo(-2,-16,1,-16); ctx.fill();
  // canas en las mejillas
  ctx.fillStyle=C.muzzle; ctx.globalAlpha=.7;
  ctx.beginPath(); ctx.ellipse(-9,5,6,5,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(15,4,4,5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  // hocico canoso, largo
  shape(ell(6,8,11.5,8.5,-.08), C.muzzle);
  ctx.fillStyle=C.muzzleShade; ctx.beginPath(); ctx.ellipse(6,13,8,3,0,0,Math.PI); ctx.fill();
  // boca
  shape(()=>{ ctx.moveTo(9,6); ctx.lineTo(9,9.5); ctx.moveTo(3,10.5); ctx.quadraticCurveTo(9,13,15,10); }, null, 1.6);
  if(tongue||dead) shape(()=>{ ctx.moveTo(7,11.5); ctx.lineTo(7,15); ctx.quadraticCurveTo(10,20,13,15); ctx.lineTo(13,11); ctx.closePath(); }, C.tongue, 1.6);
  // nariz grande
  shape(ell(9,3,5.6,4.1), C.black, 1.6);
  ctx.fillStyle='rgba(255,255,255,.65)'; ctx.beginPath(); ctx.ellipse(7.3,1.6,1.9,1,-.2,0,7); ctx.fill();
  // cejitas
  ctx.fillStyle=C.tan; ctx.beginPath(); ctx.ellipse(-6,-13,2.6,1.6,-.3,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(10,-14,2.4,1.5,.3,0,7); ctx.fill();
  // ojos de foca
  eye(-5,-5,5.4,blink,dead,look.gaze);
  eye(10,-6,6.2,blink,dead,look.gaze);
}
function eye(x,y,r,blink,dead,gaze=0){
  shape(ell(x,y,r+1.8,r+1.6), C.rim, 1.6);
  if(dead){ shape(()=>{ ctx.moveTo(x-r*.7,y-r*.7); ctx.lineTo(x+r*.7,y+r*.7); ctx.moveTo(x+r*.7,y-r*.7); ctx.lineTo(x-r*.7,y+r*.7); }, null, 2.2); return; }
  if(blink){ ctx.fillStyle=C.brown; ctx.beginPath(); ctx.ellipse(x,y,r+1.8,r+1.6,0,0,7); ctx.fill();
    shape(()=>{ ctx.moveTo(x-r,y); ctx.quadraticCurveTo(x,y+r*.7,x+r,y); }, null, 1.8); return; }
  shape(ell(x+gaze,y,r,r), C.black, 0);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+gaze-r*.35,y-r*.38,r*.38,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+gaze+r*.35,y+r*.32,r*.16,0,7); ctx.fill();
}

// Rufi entero. (fx,fy) = punto entre las patas, en el piso
function drawRufi(fx, fy, t, state, blink, s=0.82){
  const run = state==='run', jump = state==='jump', dead = state==='dead';
  const a = t*18;
  ctx.save(); ctx.translate(fx,fy);
  // sombra
  if(!dead){ const hgt = Math.max(0, GROUND-fy); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(2, GROUND-fy, 26*s*Math.max(.4,1-hgt/150), 4*s, 0,0,7); ctx.fill(); }
  ctx.scale(s,s);
  const bob = run ? -Math.abs(Math.sin(a))*2.5 : 0;
  ctx.translate(0,bob);
  let tilt = jump ? -.12 : dead ? .05 : 0; ctx.rotate(tilt);
  const legAng = (o)=> run ? Math.sin(a+o)*.75 : 0;
  const leg=(x,ang,far)=>{
    ctx.save(); ctx.translate(x,-17); ctx.rotate(ang);
    shape(rrect(-4,-2,8,16,4), far?C.whiteShade:C.white, 2.2);
    if(!far){ ctx.fillStyle=C.freckle; ctx.beginPath(); ctx.arc(-1,5,1,0,7); ctx.arc(1.5,9,.9,0,7); ctx.fill(); }
    shape(ell(1.5,14.5,5.5,3.5), far?C.whiteShade:C.white, 2.2);
    ctx.fillStyle=OUT; ctx.fillRect(3,15.5,1.2,2); ctx.fillRect(5.2,15,1.2,2);
    ctx.restore();
  };
  // patas lejanas
  if(jump){ leg(-14,.9,true); leg(18,-.9,true); } else { leg(-14,legAng(Math.PI*.5),true); leg(18,legAng(Math.PI*1.5),true); }
  // cola blanca con base marrón, meneándose
  ctx.save(); ctx.translate(-25,-30); ctx.rotate(-.5 + Math.sin(t*(run?22:10))*.35);
  shape(()=>{ ctx.moveTo(-3,2); ctx.quadraticCurveTo(-6,-10,-2,-20); ctx.quadraticCurveTo(2,-21,3,-18); ctx.quadraticCurveTo(0,-9,4,1); ctx.closePath(); }, C.white, 2.2);
  ctx.fillStyle=C.brown; ctx.beginPath(); ctx.moveTo(-3,1); ctx.quadraticCurveTo(-4.5,-4,-4,-6); ctx.lineTo(1.8,-6); ctx.quadraticCurveTo(1.6,-3,3.4,0); ctx.fill();
  ctx.restore();
  // cuerpo
  shape(ell(0,-27,27,12.5), C.white);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,-27,25.8,11.3,0,0,7); ctx.clip();
  ctx.fillStyle=C.brown; ctx.beginPath(); ctx.ellipse(1,-38,16,10,.05,0,7); ctx.fill();      // montura del lomo
  ctx.beginPath(); ctx.ellipse(-26,-31,9,10,0,0,7); ctx.fill();                            // cadera
  ctx.fillStyle=C.whiteShade; ctx.beginPath(); ctx.ellipse(0,-15,22,4,0,0,7); ctx.fill();   // panza
  ctx.fillStyle=C.freckle; [[-12,-22],[-8,-19],[6,-21],[12,-18],[-16,-17],[16,-24]].forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,1.1,0,7); ctx.fill(); });
  ctx.restore();
  // patas cercanas
  if(jump){ leg(-18,1.0,false); leg(14,-1.0,false); } else { leg(-18,legAng(Math.PI*1.5),false); leg(14,legAng(Math.PI*.5),false); }
  // cuello y pecho
  shape(()=>{ ctx.moveTo(12,-36); ctx.quadraticCurveTo(26,-44,30,-36); ctx.quadraticCurveTo(30,-22,18,-17); ctx.quadraticCurveTo(14,-24,12,-36); ctx.closePath(); }, C.white);
  // collar gris
  ctx.save(); ctx.translate(23,-38); ctx.rotate(-.35); shape(rrect(-10,-3,20,6,3), C.collar, 2.2); ctx.restore();
  // cabeza
  ctx.save(); ctx.translate(27,-55 + (run ? Math.sin(a*2)*.8 : 0)); ctx.rotate(jump?.1:0);
  drawHead(t, {blink, dead, tongue: run && Math.sin(t*3)>.3, gaze: jump? .8 : 0});
  ctx.restore();
  ctx.restore();
}

// ---------- obstáculos y premios ----------
function drawPoop(x,y,t){
  // y = piso. caca cartoon con moscas y olor
  ctx.save(); ctx.translate(x,y);
  shape(ell(0,-5,12,5.5), '#7a4a22');
  shape(ell(0,-11,9,4.6), '#8d5a2b');
  shape(ell(0,-16,6,3.8), '#a06a35');
  shape(()=>{ ctx.moveTo(-1,-19); ctx.quadraticCurveTo(2,-25,5,-22); }, null, 2.4);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(-5,-7,3,1.4,-.3,0,7); ctx.ellipse(-3,-12.5,2,1,-.3,0,7); ctx.fill();
  ctx.strokeStyle='rgba(120,170,90,.7)'; ctx.lineWidth=1.6;
  for(let i=0;i<3;i++){ const o=((t*14+i*6)%18); ctx.globalAlpha=1-o/18; ctx.beginPath(); ctx.moveTo(-6+i*6,-22-o); ctx.quadraticCurveTo(-3+i*6,-25-o,-6+i*6,-28-o); ctx.stroke(); }
  ctx.globalAlpha=1;
  for(let i=0;i<2;i++){ const a=t*9+i*3; const fx=Math.cos(a)*11, fy=-24+Math.sin(a*1.4)*5;
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(fx,fy,1.3,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(fx-1,fy-1.6,1.4,.8,Math.sin(t*60),0,7); ctx.fill(); }
  ctx.restore();
}
function drawPuddle(x,y,w,t){
  ctx.save(); ctx.translate(x+w/2,y);
  shape(ell(0,-1,w/2,5), '#4f9ee0', 2.2);
  ctx.fillStyle='#86c6f4'; ctx.beginPath(); ctx.ellipse(-w*.1,-2,w*.32,2.2,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.3;
  const k=(t*1.5)%1; ctx.globalAlpha=1-k; ctx.beginPath(); ctx.ellipse(w*.18,-1,3+k*8,1+k*2,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
  ctx.restore();
}
function drawPaw(x,y,t,gold){
  y += Math.sin(t*5+x*.05)*3;
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*4+x)*.15);
  const glow = gold ? 'rgba(255,220,60,.45)' : 'rgba(255,255,255,.4)';
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,13+Math.sin(t*8)*1.5,0,7); ctx.fill();
  const c = gold ? '#ffd23f' : '#f6a33b';
  // pata de pollo: caña + 3 dedos + espolón
  const foot=()=>{ ctx.moveTo(0,-11); ctx.lineTo(0,2); ctx.moveTo(0,2); ctx.lineTo(-7,9); ctx.moveTo(0,2); ctx.lineTo(0,10); ctx.moveTo(0,2); ctx.lineTo(7,9); ctx.moveTo(0,-1); ctx.lineTo(-4,-4); };
  shape(foot, null, 6.5);
  shape(foot, null, 3.4, c);
  if(gold){ ctx.fillStyle='#fff'; const s=Math.abs(Math.sin(t*6))*3; ctx.fillRect(8-s/2,-10,s,1); ctx.fillRect(8-.5,-10-s/2,1,s); }
  ctx.restore();
}

// ---------- fondo cartoon ----------
function items(off, spacing, seed, fn){
  const i0 = Math.floor(off/spacing)-1, i1 = Math.floor((off+W)/spacing)+1;
  for(let i=i0;i<=i1;i++) fn(i*spacing - off + hash(i+seed)*spacing*.5, i);
}
function cloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.06)'; ctx.beginPath(); ctx.ellipse(2,9,30,6,0,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-16,2,10,0,7); ctx.arc(0,-4,14,0,7); ctx.arc(16,2,10,0,7); ctx.ellipse(0,5,28,8,0,0,7); ctx.fill();
  ctx.restore();
}
function tree(x,s,v){
  ctx.save(); ctx.translate(x,GROUND); ctx.scale(s,s);
  shape(rrect(-4,-34,8,36,3), '#8a5a34', 2.2);
  const greens = v>.5 ? ['#3e9e5a','#57b871'] : ['#4aa860','#6ccb80'];
  shape(()=>{ ctx.arc(-13,-44,14,0,7); }, greens[0]);
  shape(()=>{ ctx.arc(13,-44,14,0,7); }, greens[0]);
  shape(()=>{ ctx.arc(0,-58,17,0,7); }, greens[1]);
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(-6,-64,5,0,7); ctx.fill();
  ctx.restore();
}
function prop(x,v,night){
  ctx.save(); ctx.translate(x,GROUND);
  if(v<.3){ // banco
    shape(rrect(-18,-17,36,5,2), '#b8713a', 2); shape(rrect(-18,-10,36,4,2), '#b8713a', 2);
    shape(rrect(-15,-6,3,7,1), '#555', 1.6); shape(rrect(12,-6,3,7,1), '#555', 1.6);
  } else if(v<.55){ // farola
    if(night>.15){ ctx.fillStyle=`rgba(255,230,140,${night*.35})`; ctx.beginPath(); ctx.moveTo(-2,-56); ctx.lineTo(-22,0); ctx.lineTo(22,0); ctx.fill(); }
    shape(rrect(-2,-58,4,58,2), '#37404d', 1.6);
    shape(()=>{ ctx.moveTo(-7,-58); ctx.lineTo(7,-58); ctx.lineTo(4,-66); ctx.lineTo(-4,-66); ctx.closePath(); }, '#37404d', 1.6);
    shape(ell(0,-56,4,2.4), night>.15?'#fff4b8':'#f8e7a8', 1.4);
  } else if(v<.8){ // arbusto con flores
    shape(()=>{ ctx.arc(-9,-6,9,Math.PI,0); ctx.arc(2,-9,11,Math.PI,0); ctx.arc(13,-5,8,Math.PI,0); ctx.closePath(); }, '#3fa457', 2);
    [['#ff7aa8',-8,-10],['#fff27a',3,-15],['#ff9f6e',12,-8],['#fff',-2,-6]].forEach(([c,fx,fy])=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(fx,fy,2,0,7); ctx.fill(); });
  } else { // cartel "juntá la caca"
    shape(rrect(-1.5,-26,3,26,1), '#8a5a34', 1.6);
    shape(rrect(-13,-34,26,12,3), '#fff6df', 1.8);
    ctx.font='7px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=OUT; ctx.fillText('🐾 💩', 0, -27.5);
  }
  ctx.restore();
}
function hills(off, base, amp, f1, col){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,GROUND+2);
  for(let x=0;x<=W+8;x+=8){ const X=x+off; ctx.lineTo(x, base - Math.sin(X/f1)*amp - Math.sin(X/(f1*.41)+1)*amp*.35); }
  ctx.lineTo(W+8,GROUND+2); ctx.fill();
}
function drawGround(off){
  ctx.fillStyle='#e7c48b'; ctx.fillRect(-20,GROUND,W+40,H-GROUND+20);
  const depth = Math.max(4,H-GROUND-20);
  ctx.fillStyle='#d6ae72'; items(off, 26, 9, (x,i)=>{ ctx.beginPath(); ctx.ellipse(x, GROUND+12+hash(i)*depth, 3+hash(i+1)*3, 1.4,0,0,7); ctx.fill(); });
  ctx.fillStyle='#f3d8a8'; items(off, 37, 2, (x,i)=>{ ctx.beginPath(); ctx.arc(x, GROUND+10+hash(i+4)*depth, 1.2,0,7); ctx.fill(); });
  // pasto con borde ondulado
  ctx.fillStyle='#5cc04a'; ctx.fillRect(-20,GROUND-3,W+40,7);
  ctx.fillStyle='#4aa83c'; ctx.beginPath(); const sp=8, o=off%sp;
  for(let x=-o-sp;x<W+sp;x+=sp){ ctx.moveTo(x,GROUND+4); ctx.arc(x+sp/2,GROUND+4,sp/2,0,Math.PI); }
  ctx.fill();
  ctx.strokeStyle='#7ad65f'; ctx.lineWidth=1.5; ctx.beginPath();
  items(off, 9, 5, (x,i)=>{ ctx.moveTo(x,GROUND-2); ctx.lineTo(x-1+hash(i)*2,GROUND-6-hash(i+3)*3); }); ctx.stroke();
}

// ---------- audio ----------
let AC=null, muted=false;
try{ muted = localStorage.getItem('rufi-mute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function beep(f1,f2,dur,type='square',vol=.08,delay=0){
  if(muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+delay;
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
const sfx = {
  jump(){ beep(300,620,.14,'triangle',.12); },
  jump2(){ beep(500,950,.14,'triangle',.12); },
  paw(){ beep(880,880,.06,'square',.05); beep(1320,1320,.1,'square',.05,.06); },
  gold(){ [660,880,1100,1320,1760].forEach((f,i)=>beep(f,f,.08,'square',.05,i*.06)); },
  bark(){ beep(520,180,.12,'sawtooth',.12); beep(480,160,.16,'sawtooth',.12,.16); },
  milestone(){ beep(990,990,.05,'triangle',.08); beep(1480,1480,.1,'triangle',.08,.06); }
};

// ---------- estado ----------
let state='title', t=0, score=0, best=0, speed, dist=0, shake=0, overAt=0, newBest=false;
let dog, obs=[], paws=[], parts=[], floaters=[], nextSpawn=0, nextPaw=0, deathMsg='', combo=0, lastMilestone=0, blinkT=2;
try{ best = +localStorage.getItem('rufi-best')||0; }catch(e){}
const DEATH_POOP = ['¡Rufi pisó caca!','Eso no era chocolate...','Plan B: baño urgente','Rufi: "no fui yo"','Hoy duerme en el balcón'];
const DEATH_WATER = ['¡Rufi odia mojarse las patas!','Charco 1 - Rufi 0','Splash. Rufi ofendido.','Necesita toalla YA','Modo perro mojado activado'];
const DOGX = 52;

function reset(){
  dog = {y:GROUND, vy:0, onGround:true, holding:false, jumps:0};
  obs=[]; paws=[]; parts=[]; floaters=[]; score=0; dist=0; speed=170; nextSpawn=1.3; nextPaw=2; combo=0; lastMilestone=0;
}

function jumpPress(){
  ac();
  if(state==='title'){ state='play'; reset(); return; }
  if(state==='over'){ if(t-overAt>.6){ state='play'; reset(); } return; }
  if(dog.onGround || dog.jumps<2){
    const second = !dog.onGround;
    dog.vy = second ? -390 : -430; dog.onGround=false; dog.jumps++; dog.holding=true;
    second ? sfx.jump2() : sfx.jump();
    puff(DOGX, GROUND, 6, '#f3d8a8');
    if(second) for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; parts.push({x:DOGX,y:dog.y-10,vx:Math.cos(a)*90,vy:Math.sin(a)*90,life:.35,col:'#fff',r:2.5}); }
  }
}
function jumpRelease(){ dog.holding=false; }
function puff(x,y,n,col){ for(let i=0;i<n;i++) parts.push({x,y,vx:-40-Math.random()*60,vy:-Math.random()*60,life:.4+Math.random()*.3,col,r:2+Math.random()*2.5}); }
function floater(x,y,txt,col,size=14){ floaters.push({x,y,txt,col,size,life:1}); }

function spawn(){
  const k = Math.random(), lvl = Math.min(1,(speed-170)/230);
  if(k < .42) obs.push({type:'poop',x:W+20,w:24});
  else if(k < .74) obs.push({type:'puddle',x:W+20,w:40+Math.floor(Math.random()*30*(1+lvl))});
  else { obs.push({type:'poop',x:W+20,w:24}); obs.push({type:'poop',x:W+46,w:24}); }
  nextSpawn = Math.max(.6, (1.0 + Math.random()*1.0) * (1 - lvl*.35));
  if(Math.random()<.4) paws.push({x:W+30, y:GROUND-85-Math.random()*25, gold:Math.random()<.12});
}
const hit=(a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

function update(dt){
  t += dt;
  blinkT -= dt; if(blinkT < -0.13) blinkT = 2+Math.random()*3;
  shake = Math.max(0, shake - dt*40);
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.life-=dt; }); parts=parts.filter(p=>p.life>0);
  floaters.forEach(f=>{ f.y-=28*dt; f.life-=dt; }); floaters=floaters.filter(f=>f.life>0);
  if(state!=='play'){ if(state==='title') dist += 60*dt; return; }

  speed = Math.min(420, speed + dt*4.5);
  dist += speed*dt;
  score += speed*dt*0.035;
  const ms = Math.floor(score/100);
  if(ms>lastMilestone){ lastMilestone=ms; sfx.milestone(); floater(W/2,GROUND*.35,ms*100+'!','#fff',22); }

  const g = (dog.holding && dog.vy<0) ? 900 : 1900;
  dog.vy += g*dt; dog.y += dog.vy*dt;
  if(dog.y >= GROUND){ if(!dog.onGround) puff(DOGX,GROUND,5,'#f3d8a8'); dog.y=GROUND; dog.vy=0; dog.onGround=true; dog.jumps=0; }
  if(dog.onGround && Math.random()<dt*14) parts.push({x:DOGX-14,y:GROUND-2,vx:-speed*.3,vy:-30-Math.random()*30,life:.3,col:'#f3d8a8',r:2});

  nextSpawn -= dt; if(nextSpawn<=0) spawn();
  nextPaw -= dt; if(nextPaw<=0){ paws.push({x:W+20, y: Math.random()<.5 ? GROUND-22 : GROUND-70-Math.random()*30, gold:Math.random()<.08}); nextPaw=1.1+Math.random()*2; }
  obs.forEach(o=>o.x -= speed*dt); obs=obs.filter(o=>o.x+o.w>-30);
  paws.forEach(p=>p.x -= speed*dt); paws=paws.filter(p=>p.x>-30 && !p.got);

  // hitboxes de Rufi: cuerpo + cabeza
  const y=dog.y;
  const body = {x:DOGX-18, y:y-30, w:34, h:28}, head = {x:DOGX+6, y:y-62, w:26, h:26};
  for(const o of obs){
    const ob = o.type==='poop' ? {x:o.x-8,y:GROUND-16,w:16,h:16} : {x:o.x+6,y:GROUND-4,w:o.w-12,h:6};
    if(hit(body,ob) || hit(head,ob)){ die(o.type); return; }
  }
  const grab = {x:DOGX-24, y:y-70, w:64, h:72};
  for(const p of paws){
    if(hit(grab,{x:p.x-8,y:p.y-11,w:16,h:22})){
      p.got=true; combo++;
      const mult=Math.min(5,combo), pts=(p.gold?100:10)*mult; score+=pts;
      floater(p.x, p.y-14, '+'+pts+(mult>1?' x'+mult:''), p.gold?'#ffd23f':'#fff');
      for(let i=0;i<12;i++) parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.8)*180,life:.5,col:p.gold?'#ffd23f':'#f6a33b',r:2.5});
      p.gold ? sfx.gold() : sfx.paw();
    }
  }
  for(const p of paws) if(!p.got && !p.missed && p.x < DOGX-30){ p.missed=true; combo=0; }
}

function die(type){
  state='over'; overAt=t; shake=10; sfx.bark();
  const list = type==='poop'?DEATH_POOP:DEATH_WATER; deathMsg = list[Math.floor(Math.random()*list.length)];
  const col = type==='puddle' ? '#86c6f4' : '#8d5a2b';
  for(let i=0;i<22;i++) parts.push({x:DOGX+10,y:GROUND-4,vx:(Math.random()-.4)*220,vy:-Math.random()*220,life:.9,col,r:2+Math.random()*3});
  newBest = score>best;
  if(newBest){ best=Math.floor(score); try{ localStorage.setItem('rufi-best',best); }catch(e){} }
}

// ---------- dibujo ----------
function mix(a,b,k){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  return 'rgb('+[16,8,0].map(s=>Math.round(((pa>>s)&255)*(1-k)+((pb>>s)&255)*k)).join(',')+')'; }
function sky(){
  const cyc = (((dist/14000)%1)+1)%1, ph=[['#6cc3ec','#c9f0ff'],['#f2875b','#ffd6a0'],['#211f4f','#4d3f86'],['#6cc3ec','#c9f0ff']];
  const f=cyc*3, i=Math.floor(f), k=f-i;
  return { top:mix(ph[i][0],ph[i+1][0],k), bot:mix(ph[i][1],ph[i+1][1],k), night: i===1?k*.8 : i===2?1-k : 0 };
}
function text(s,x,y,size,col,align='center',outline=OUT){
  ctx.font=size+'px '+FONT; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.lineJoin='round';
  if(outline){ ctx.lineWidth=size*.28; ctx.strokeStyle=outline; ctx.strokeText(s,x,y); }
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}

function draw(){
  ctx.setTransform(SCALE*DPR,0,0,SCALE*DPR,0,0);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  const sk = sky();
  const gr=ctx.createLinearGradient(0,0,0,GROUND); gr.addColorStop(0,sk.top); gr.addColorStop(1,sk.bot);
  ctx.fillStyle=gr; ctx.fillRect(-20,-20,W+40,H+40);
  // sol con rayos o luna con estrellas
  const sx=W-70, sy=Math.max(60, GROUND*.28);
  if(sk.night>.35){
    ctx.fillStyle='#fff';
    for(let i=0;i<40;i++){ const x=hash(i)*W, y=hash(i+50)*GROUND*.7, tw=.5+.5*Math.sin(t*3+i); ctx.globalAlpha=sk.night*tw; ctx.beginPath(); ctx.arc(x,y,1,0,7); ctx.fill(); }
    ctx.globalAlpha=sk.night; shape(ell(sx,sy,13,13), '#f7f1cf', 0);
    ctx.fillStyle='#e2dbb2'; ctx.beginPath(); ctx.arc(sx-4,sy-3,3,0,7); ctx.arc(sx+5,sy+4,2,0,7); ctx.fill(); ctx.globalAlpha=1;
  } else {
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(t*.3); ctx.fillStyle='rgba(255,226,90,.5)';
    for(let i=0;i<10;i++){ ctx.rotate(Math.PI/5); ctx.beginPath(); ctx.moveTo(-3,-19); ctx.lineTo(0,-28); ctx.lineTo(3,-19); ctx.fill(); }
    ctx.restore(); shape(ell(sx,sy,15,15), '#ffd84a', 2.4, '#f0a020');
  }
  items(dist*.08, 150, 1, (x,i)=> cloud(x, GROUND*.12 + hash(i+7)*GROUND*.3, .6+hash(i+3)*.5));
  hills(dist*.15, GROUND-52, 16, 90, '#a7dcb6');
  hills(dist*.3, GROUND-26, 10, 60, '#86cd98');
  items(dist*.5, 95, 3, (x,i)=> tree(x, .55+hash(i+2)*.35, hash(i+9)));
  items(dist*.75, 150, 4, (x,i)=> prop(x, hash(i+11), sk.night));
  drawGround(dist);

  for(const o of obs) o.type==='poop' ? drawPoop(o.x,GROUND,t) : drawPuddle(o.x,GROUND,o.w,t);
  for(const p of paws) drawPaw(p.x,p.y,t,p.gold);

  const blink = blinkT<0;
  if(state==='title') drawRufi(DOGX+20, GROUND, t, 'run', blink);
  else drawRufi(DOGX, dog.y, t, state==='over'?'dead':(dog.onGround?'run':'jump'), blink);

  for(const p of parts){ ctx.globalAlpha=Math.min(1,p.life*3); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r||2,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life*2); text(f.txt,f.x,f.y,f.size,f.col); }
  ctx.globalAlpha=1;
  if(sk.night>0){ ctx.fillStyle=`rgba(26,20,70,${sk.night*.22})`; ctx.fillRect(-20,-20,W+40,H+40); }

  const portrait = H > W*1.05;
  if(state!=='title'){
    const top = portrait ? 30 : 18;
    text(String(Math.floor(score)), 12, top, 20, '#fff', 'left');
    text('RÉCORD '+best, 12, top+18, 11, '#ffd84a', 'left');
    if(combo>1 && state==='play') text('COMBO x'+Math.min(5,combo), 12, top+34, 12, '#ff9f6e', 'left');
  }

  // layout de pantallas: vertical = retrato arriba del texto; horizontal = retrato al costado
  const side = !portrait && W >= 380;
  const cy = portrait ? GROUND*.5 : GROUND*.42;
  const tx = side ? W/2-20 : W/2;
  const L = portrait
    ? {hx:W/2, hy:cy-78, hs:2.1, title:cy+14, sub:cy+46, cta:cy+72, rec:cy+96, big:44, mid:17}
    : side
    ? {hx:Math.min(W-70, W/2+175), hy:cy+4, hs:1.5, title:cy-22, sub:cy+2, cta:cy+22, rec:cy+40, big:32, mid:14}
    : {hx:W/2, hy:cy-40, hs:.8, title:cy-2, sub:cy+20, cta:cy+38, rec:cy+54, big:26, mid:13};
  if(state==='title'){
    ctx.fillStyle='rgba(30,20,60,.25)'; ctx.fillRect(-20,-20,W+40,H+40);
    const bob=Math.sin(t*3)*3;
    ctx.save(); ctx.translate(L.hx, L.hy+bob); ctx.scale(L.hs,L.hs);
    drawHead(t,{blink, tongue:true, gaze:Math.sin(t*.8)*1.2}); ctx.restore();
    text('RUFI RUN', tx, L.title+bob*.5, L.big, '#ffd84a');
    text('Saltá cacas y charcos · juntá patitas de pollo', tx, L.sub, portrait?11:10, '#fff');
    if(Math.floor(t*2.5)%2) text('¡TOCÁ PARA ARRANCAR!', tx, L.cta, L.mid, '#fff');
    if(best) text('Récord: '+best, tx, L.rec, 12, '#ffd84a');
    text('mantené para saltar más alto · doble toque = doble salto', W/2, H-(portrait?24:10), 9, '#fff');
  }
  if(state==='over'){
    ctx.fillStyle='rgba(30,20,60,.35)'; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.save(); ctx.translate(L.hx, L.hy); const ps=L.hs*.9; ctx.scale(ps,ps); ctx.rotate(Math.sin(t*2)*.08);
    drawHead(t,{dead:true}); ctx.restore();
    text('¡GAME OVER!', tx, L.title-(portrait?6:0), L.big*.85, '#ff6b6b');
    text(deathMsg, tx, L.sub+(portrait?-8:0), 12, '#fff');
    text(Math.floor(score)+' puntos', tx, L.cta-(portrait?6:0), 16, '#fff');
    if(newBest){ if(Math.floor(t*4)%2) text('¡NUEVO RÉCORD!', tx, L.rec, 14, '#ffd84a'); }
    else text('Récord: '+best, tx, L.rec, 12, '#ffd84a');
    if(t-overAt>.6) text('tocá para revivir', tx, L.rec+(portrait?24:18), 12, '#fff');
  }
  ctx.restore();
}

// ---------- tamaño: horizontal = 180 de alto; vertical = más cielo y más camino ----------
function resize(){
  const vw = innerWidth, vh = innerHeight, aspect = vw/vh;
  if(aspect >= 1.25){ H = 180; W = H*aspect; GROUND = H-34; }
  else { W = 250; H = W/aspect; GROUND = Math.round(Math.max(H*.62, H-170)); }
  SCALE = vw / W;
  DPR = Math.min(3, devicePixelRatio||1);
  cv.width = Math.round(vw*DPR); cv.height = Math.round(vh*DPR);
  if(dog && dog.onGround) dog.y = GROUND;
}
addEventListener('resize', resize);

// ---------- input ----------
const isBtn = e => e.target.closest && e.target.closest('#btns');
addEventListener('pointerdown', e=>{ if(isBtn(e)) return; e.preventDefault(); jumpPress(); }, {passive:false});
addEventListener('pointerup', jumpRelease); addEventListener('pointercancel', jumpRelease);
addEventListener('keydown', e=>{ if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){ e.preventDefault(); if(!e.repeat) jumpPress(); } });
addEventListener('keyup', e=>{ if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)) jumpRelease(); });
const muteBtn=document.getElementById('mute');
const setMuteIcon=()=>muteBtn.textContent=muted?'🔇':'🔊'; setMuteIcon();
muteBtn.onclick=()=>{ muted=!muted; setMuteIcon(); try{ localStorage.setItem('rufi-mute',muted?'1':'0'); }catch(e){} };
document.getElementById('fs').onclick=()=>{ const d=document.documentElement;
  if(!document.fullscreenElement){ const req=d.requestFullscreen||d.webkitRequestFullscreen; if(req) req.call(d); }
  else if(document.exitFullscreen) document.exitFullscreen(); };

// ---------- loop ----------
let last = performance.now();
document.addEventListener('visibilitychange', ()=>{ last=performance.now(); });
function loop(now){
  const dt = Math.max(0, Math.min(.05,(now-last)/1000)); last=now;
  update(dt); draw(); requestAnimationFrame(loop);
}
resize(); reset();
requestAnimationFrame(loop);
})();
</script>
</body>
